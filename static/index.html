<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiteRoute API - Minimal Consumer Client</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e2e8f0;
      --badge-bg: #eff6ff;
      --badge-text: #1d4ed8;
      --star: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--text);
    }

    p.subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    /* Controls bar */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
    }

    select {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.875rem;
      background-color: #fff;
      color: var(--text);
      cursor: pointer;
    }

    select:focus {
      outline: 2px solid var(--primary);
    }

    /* List container */
    .restaurant-list {
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
      margin-bottom: 1.5rem;
    }

    .restaurant-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.15s ease;
    }

    .restaurant-card:hover {
      border-color: #cbd5e1;
    }

    .restaurant-info h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .restaurant-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.025em;
    }

    .rating {
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }

    .rating-star {
      color: var(--star);
    }

    .fee {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      text-align: right;
    }

    .fee-sub {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Pagination controls */
    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    button {
      padding: 0.5rem 1rem;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    button:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    .page-info {
      font-size: 0.875rem;
      color: var(--muted);
      font-weight: 500;
    }

    /* Status and Feedback */
    .status-box {
      text-align: center;
      padding: 3rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
    }

    .error-box {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>BiteRoute Explorer</h1>
      <p class="subtitle">Minimal consumer client querying <code>/api/v1/restaurants</code></p>
    </header>

    <div class="controls">
      <div class="filter-group">
        <label for="categoryFilter">Category:</label>
        <select id="categoryFilter">
          <option value="">All Categories</option>
          <option value="Pizza">Pizza</option>
          <option value="Sushi">Sushi</option>
          <option value="Burgers">Burgers</option>
          <option value="Bakery">Bakery</option>
          <option value="Vegan">Vegan</option>
          <option value="Italian">Italian</option>
          <option value="Mexican">Mexican</option>
          <option value="Japanese">Japanese</option>
          <option value="American">American</option>
          <option value="Mediterranean">Mediterranean</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="limitSelect">Page Size:</label>
        <select id="limitSelect">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </select>
      </div>
    </div>

    <!-- Dynamic container -->
    <div id="contentArea">
      <div class="status-box">Loading restaurants...</div>
    </div>

    <!-- Pagination buttons -->
    <div class="pagination" id="paginationControls" style="display: none;">
      <button id="prevBtn" disabled>&larr; Previous</button>
      <span class="page-info" id="pageInfoText">Page 1</span>
      <button id="nextBtn">Next Page &rarr;</button>
    </div>
  </div>

  <script>
    // Client State
    let currentOffset = 0;
    let currentLimit = 10;
    let currentCategory = "";
    let totalItems = 0;
    let hasMore = false;

    const contentArea = document.getElementById("contentArea");
    const categoryFilter = document.getElementById("categoryFilter");
    const limitSelect = document.getElementById("limitSelect");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageInfoText = document.getElementById("pageInfoText");
    const paginationControls = document.getElementById("paginationControls");

    function formatCurrency(cents) {
      return "$" + (cents / 100).toFixed(2);
    }

    async function fetchRestaurants() {
      contentArea.innerHTML = `<div class="status-box">Fetching restaurants...</div>`;

      const params = new URLSearchParams({
        limit: currentLimit,
        offset: currentOffset,
        sort: "name",
        order: "asc"
      });

      if (currentCategory) {
        params.append("category", currentCategory);
      }

      try {
        const response = await fetch(`/api/v1/restaurants?${params.toString()}`);
        const result = await response.json();

        if (!response.ok) {
          const errMsg = (result && result.error && result.error.message) || `HTTP Error ${response.status}`;
          contentArea.innerHTML = `<div class="status-box error-box"><strong>Error:</strong> ${errMsg}</div>`;
          paginationControls.style.display = "none";
          return;
        }

        renderRestaurants(result.data, result.meta);
      } catch (err) {
        contentArea.innerHTML = `<div class="status-box error-box"><strong>Network Error:</strong> Failed to connect to API.</div>`;
        paginationControls.style.display = "none";
      }
    }

    function renderRestaurants(restaurants, meta) {
      if (!restaurants || restaurants.length === 0) {
        contentArea.innerHTML = `<div class="status-box">No restaurants found matching your criteria.</div>`;
        paginationControls.style.display = "none";
        return;
      }

      totalItems = meta.total;
      hasMore = meta.hasMore;

      const html = restaurants.map(r => `
        <div class="restaurant-card">
          <div class="restaurant-info">
            <h3>${r.name}</h3>
            <div class="restaurant-meta">
              <span class="badge">${r.category || r.cuisine_type}</span>
              <span class="rating"><span class="rating-star">&#9733;</span> ${Number(r.rating).toFixed(2)}</span>
              <span>&bull;</span>
              <span>${r.estimated_delivery_minutes} min delivery</span>
            </div>
          </div>
          <div class="fee">
            ${formatCurrency(r.delivery_fee_cents)}
            <div class="fee-sub">delivery fee</div>
          </div>
        </div>
      `).join("");

      contentArea.innerHTML = `<div class="restaurant-list">${html}</div>`;

      // Update Pagination UI
      paginationControls.style.display = "flex";
      prevBtn.disabled = currentOffset <= 0;
      nextBtn.disabled = !hasMore;

      const pageNum = Math.floor(currentOffset / currentLimit) + 1;
      const totalPages = Math.max(1, Math.ceil(totalItems / currentLimit));
      pageInfoText.textContent = `Page ${pageNum} of ${totalPages} (${totalItems} total)`;
    }

    // Event Listeners
    categoryFilter.addEventListener("change", (e) => {
      currentCategory = e.target.value;
      currentOffset = 0;
      fetchRestaurants();
    });

    limitSelect.addEventListener("change", (e) => {
      currentLimit = parseInt(e.target.value, 10);
      currentOffset = 0;
      fetchRestaurants();
    });

    prevBtn.addEventListener("click", () => {
      if (currentOffset > 0) {
        currentOffset = Math.max(0, currentOffset - currentLimit);
        fetchRestaurants();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (hasMore) {
        currentOffset += currentLimit;
        fetchRestaurants();
      }
    });

    // Initial Fetch
    fetchRestaurants();
  </script>
</body>
</html>
